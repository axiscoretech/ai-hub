name: Smoke services

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux libraries for Electron
        run: |
          sudo npx playwright install-deps chromium
          sudo apt-get install -y xvfb

      - name: Let Electron use its Linux sandbox
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Compile
        run: npm run build

      - name: Check service pages
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" npx electron scripts/smoke-services.js
