name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-mac:
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Compile
        run: npm run build

      - name: Test
        run: npm test

      - name: Detect signing secrets
        id: signing
        env:
          APPLE_SIGNING_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_P12_BASE64 }}
          APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_SIGNING_CERTIFICATE_P12_BASE64" ] && \
             [ -n "$APPLE_SIGNING_CERTIFICATE_PASSWORD" ] && \
             [ -n "$APPLE_SIGNING_IDENTITY" ] && \
             [ -n "$APPLE_ID" ] && \
             [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && \
             [ -n "$APPLE_TEAM_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Signing and notarization are enabled for this release."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Apple signing secrets are missing. Building an unsigned release."
          fi

      - name: Import Apple signing certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_SIGNING_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_P12_BASE64 }}
          APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/apple-signing-cert.p12"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          echo "$APPLE_SIGNING_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security find-identity -v "$KEYCHAIN_PATH"

          echo "CSC_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build and publish signed release
        if: steps.signing.outputs.enabled == 'true'
        run: |
          npm run build
          npx electron-builder --mac --x64 --publish always
          cp dist/latest-mac.yml "$RUNNER_TEMP/latest-mac-x64.yml"
          npx electron-builder --mac --arm64 --publish always
          node scripts/merge-mac-update-yml.js "$RUNNER_TEMP/latest-mac-x64.yml" dist/latest-mac.yml dist/latest-mac.yml
          gh release upload "${GITHUB_REF_NAME}" dist/latest-mac.yml --repo "${GITHUB_REPOSITORY}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_NAME: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify the signed Mac apps
        if: steps.signing.outputs.enabled == 'true'
        run: |
          for app in "dist/mac/AI Hub.app" "dist/mac-arm64/AI Hub.app"; do
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type open --context context:primary-signature -v "$app"
            xcrun stapler validate "$app"
          done

      - name: Build and publish unsigned release
        if: steps.signing.outputs.enabled != 'true'
        run: |
          npx electron-builder --mac --x64 --publish always -c.mac.identity=null
          cp dist/latest-mac.yml "$RUNNER_TEMP/latest-mac-x64.yml"
          npx electron-builder --mac --arm64 --publish always -c.mac.identity=null
          node scripts/merge-mac-update-yml.js "$RUNNER_TEMP/latest-mac-x64.yml" dist/latest-mac.yml dist/latest-mac.yml
          gh release upload "${GITHUB_REF_NAME}" dist/latest-mac.yml --repo "${GITHUB_REPOSITORY}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Cleanup signing keychain
        if: always() && steps.signing.outputs.enabled == 'true'
        run: |
          if [ -n "$CSC_KEYCHAIN" ]; then
            security delete-keychain "$CSC_KEYCHAIN" || true
          fi

  checksums:
    needs: [build-mac, build-win, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF_NAME}"
          mkdir -p "$RUNNER_TEMP/release-assets"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/release-assets" --clobber
          (
            cd "$RUNNER_TEMP/release-assets"
            rm -f SHA256SUMS
            sha256sum -- * > SHA256SUMS
          )
          gh release upload "$tag" "$RUNNER_TEMP/release-assets/SHA256SUMS" --repo "$GITHUB_REPOSITORY" --clobber
          notes="$(node scripts/release-notes.js)"
          title="$(node scripts/release-notes.js --title)"
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$notes"

  build-win:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Compile
        run: npm run build

      - name: Test
        run: npm test

      - name: Detect Windows signing secrets
        id: winsign
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CODE_SIGNING_NAME: ${{ secrets.AZURE_CODE_SIGNING_NAME }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
          AZURE_PUBLISHER_NAME: ${{ secrets.AZURE_PUBLISHER_NAME }}
        run: |
          if [ -n "$WIN_CSC_LINK" ] && [ -n "$WIN_CSC_KEY_PASSWORD" ]; then
            echo "mode=certificate" >> "$GITHUB_OUTPUT"
            echo "Windows release will be signed with the certificate."
          elif [ -n "$AZURE_TENANT_ID" ] && [ -n "$AZURE_CLIENT_ID" ] && \
               [ -n "$AZURE_CLIENT_SECRET" ] && [ -n "$AZURE_CODE_SIGNING_NAME" ] && \
               [ -n "$AZURE_CERT_PROFILE" ] && [ -n "$AZURE_PUBLISHER_NAME" ]; then
            echo "mode=azure" >> "$GITHUB_OUTPUT"
            echo "Windows release will be signed with Azure Trusted Signing."
          else
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
            echo "Windows signing secrets are missing. Building an unsigned release."
          fi

      - name: Build and publish certificate-signed Windows release
        if: steps.winsign.outputs.mode == 'certificate'
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Build and publish Azure-signed Windows release
        if: steps.winsign.outputs.mode == 'azure'
        run: |
          node -e "const fs=require('fs'); const build=require('./package.json').build; build.win.azureSignOptions={publisherName:process.env.AZURE_PUBLISHER_NAME,endpoint:process.env.AZURE_SIGNING_ENDPOINT||'https://eus.codesigning.azure.net/',certificateProfileName:process.env.AZURE_CERT_PROFILE,codeSigningAccountName:process.env.AZURE_CODE_SIGNING_NAME}; fs.writeFileSync(process.env.RUNNER_TEMP+'/electron-builder.json', JSON.stringify(build));"
          npx electron-builder --win --x64 --publish always --config "$RUNNER_TEMP/electron-builder.json"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_PUBLISHER_NAME: ${{ secrets.AZURE_PUBLISHER_NAME }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
          AZURE_CODE_SIGNING_NAME: ${{ secrets.AZURE_CODE_SIGNING_NAME }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}

      - name: Build and publish unsigned Windows release
        if: steps.winsign.outputs.mode == 'unsigned'
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Compile
        run: npm run build

      - name: Install Linux libraries for Electron
        run: |
          sudo npx playwright install-deps chromium
          sudo apt-get install -y xvfb

      - name: Test
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" npm test

      - name: Build and publish Linux AppImage
        run: npx electron-builder --linux AppImage --x64 --arm64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
